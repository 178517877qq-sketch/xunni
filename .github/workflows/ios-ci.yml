name: iOS CI

on:
  push:
    branches:
      - main
      - codex/ios-feimiao-batch-1-5
    paths:
      - "ios-app/FeiMiao/**"
      - "ios-app/FeiMiaoKit/**"
      - "ios-app/project.yml"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "ios-app/FeiMiao/**"
      - "ios-app/FeiMiaoKit/**"
      - "ios-app/project.yml"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swift-tests:
    name: FeiMiaoKit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_26=""
          for candidate in /Applications/Xcode_26*.app; do
            if [ -d "$candidate" ]; then XCODE_26="$candidate"; fi
          done
          if [ -z "$XCODE_26" ]; then
            echo "::error::runner 上没有 Xcode 26"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_26"
          xcodebuild -version
          swift --version
      - name: Resolve and test FeiMiaoKit
        run: swift test --package-path ios-app/FeiMiaoKit --parallel

  simulator-app:
    name: Simulator build and launch
    runs-on: macos-15
    needs: swift-tests
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_26=""
          for candidate in /Applications/Xcode_26*.app; do
            if [ -d "$candidate" ]; then XCODE_26="$candidate"; fi
          done
          if [ -z "$XCODE_26" ]; then
            echo "::error::runner 上没有 Xcode 26"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_26"
          xcodebuild -version
      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version
      - name: Generate Xcode project
        run: xcodegen generate --spec ios-app/project.yml --project ios-app
      - name: Build for iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs
          BUILD_LOG=build-logs/simulator-xcodebuild.log
          set +e
          xcodebuild build \
            -project ios-app/FeiMiao.xcodeproj \
            -scheme FeiMiao \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-simulator \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$BUILD_LOG"
          XCODEBUILD_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$XCODEBUILD_STATUS" -ne 0 ]; then
            python3 - "$BUILD_LOG" <<'PY'
          import os
          import re
          import sys

          log_path = sys.argv[1]
          workspace = os.environ.get("GITHUB_WORKSPACE", "").rstrip("/")
          pattern = re.compile(
              r"^(?P<file>.+?\.swift):(?P<line>\d+):(?P<column>\d+): "
              r"(?:fatal )?error: (?P<message>.+)$"
          )

          def escape_data(value: str) -> str:
              return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          def escape_property(value: str) -> str:
              return escape_data(value).replace(":", "%3A").replace(",", "%2C")

          seen = set()
          annotations = 0
          with open(log_path, encoding="utf-8", errors="replace") as log:
              for raw_line in log:
                  match = pattern.match(raw_line.rstrip("\r\n"))
                  if match is None:
                      continue
                  file_path = match.group("file")
                  if workspace and file_path.startswith(workspace + "/"):
                      file_path = file_path[len(workspace) + 1:]
                  diagnostic = (
                      file_path,
                      match.group("line"),
                      match.group("column"),
                      match.group("message"),
                  )
                  if diagnostic in seen:
                      continue
                  seen.add(diagnostic)
                  print(
                      "::error file={},line={},col={}::{}".format(
                          escape_property(file_path),
                          diagnostic[1],
                          diagnostic[2],
                          escape_data(diagnostic[3]),
                      )
                  )
                  annotations += 1
                  if annotations == 50:
                      break
          if annotations == 0:
              print("::error::xcodebuild failed; inspect the uploaded simulator build log for details")
          PY
            exit "$XCODEBUILD_STATUS"
          fi
      - name: Launch smoke test
        shell: bash
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available | awk '
            !found && /^[[:space:]]*iPhone/ && /\(Shutdown\)$/ {
              line=$0
              sub(/^[^(]*\(/, "", line)
              sub(/\).*/, "", line)
              print line
              found=1
            }
          ')
          if [ -z "$DEVICE" ]; then
            echo "::error::没有可用的 iPhone 模拟器"
            xcrun simctl list devices available
            exit 1
          fi
          shopt -s nullglob
          APPS=(build-simulator/Build/Products/*Debug-iphonesimulator/FeiMiao.app)
          APP_PATH="${APPS[0]:-}"
          test -d "$APP_PATH"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP_PATH"
          mkdir -p screenshots
          capture_logs() {
            xcrun simctl spawn "$DEVICE" log show \
              --style compact --last 2m \
              --predicate 'process == "FeiMiao"' > screenshots/simulator.log || true
          }
          trap capture_logs EXIT
          LAUNCH_OUTPUT=$(xcrun simctl launch "$DEVICE" com.feimiao.app)
          echo "$LAUNCH_OUTPUT"
          LAUNCH_PID="${LAUNCH_OUTPUT##*: }"
          [[ "$LAUNCH_PID" =~ ^[0-9]+$ ]]
          sleep 5
          kill -0 "$LAUNCH_PID"
          xcrun simctl get_app_container "$DEVICE" com.feimiao.app data
          xcrun simctl io "$DEVICE" screenshot screenshots/01-home.png
          xcrun simctl terminate "$DEVICE" com.feimiao.app
          SECOND_LAUNCH=$(xcrun simctl launch "$DEVICE" com.feimiao.app)
          echo "$SECOND_LAUNCH"
          SECOND_PID="${SECOND_LAUNCH##*: }"
          [[ "$SECOND_PID" =~ ^[0-9]+$ ]]
          sleep 2
          kill -0 "$SECOND_PID"
          capture_logs
          trap - EXIT
          xcrun simctl terminate "$DEVICE" com.feimiao.app
      - name: Upload simulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FeiMiao-simulator-diagnostics
          path: |
            build-logs/simulator-xcodebuild.log
            screenshots/
          if-no-files-found: ignore
      - name: Package Appetize-compatible simulator app
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          APPS=(build-simulator/Build/Products/*Debug-iphonesimulator/FeiMiao.app)
          APP_PATH="${APPS[0]:-}"
          test -d "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" FeiMiao-Appetize.zip
          unzip -tq FeiMiao-Appetize.zip
          file "$APP_PATH/FeiMiao"
          ls -lh FeiMiao-Appetize.zip screenshots/01-home.png
      - uses: actions/upload-artifact@v4
        with:
          name: FeiMiao-Appetize
          path: |
            FeiMiao-Appetize.zip
            screenshots/01-home.png
            screenshots/simulator.log
          if-no-files-found: error

  unsigned-ipa:
    name: Unsigned device IPA
    runs-on: macos-15
    needs: swift-tests
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_26=""
          for candidate in /Applications/Xcode_26*.app; do
            if [ -d "$candidate" ]; then XCODE_26="$candidate"; fi
          done
          if [ -z "$XCODE_26" ]; then
            echo "::error::runner 上没有 Xcode 26"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_26"
      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version
      - name: Generate Xcode project
        run: xcodegen generate --spec ios-app/project.yml --project ios-app
      - name: Build unsigned device app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs
          BUILD_LOG=build-logs/device-xcodebuild.log
          set +e
          xcodebuild build \
            -project ios-app/FeiMiao.xcodeproj \
            -scheme FeiMiao \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$BUILD_LOG"
          XCODEBUILD_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$XCODEBUILD_STATUS" -ne 0 ]; then
            python3 - "$BUILD_LOG" <<'PY'
          import os
          import re
          import sys

          log_path = sys.argv[1]
          workspace = os.environ.get("GITHUB_WORKSPACE", "").rstrip("/")
          pattern = re.compile(
              r"^(?P<file>.+?\.swift):(?P<line>\d+):(?P<column>\d+): "
              r"(?:fatal )?error: (?P<message>.+)$"
          )

          def escape_data(value: str) -> str:
              return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          def escape_property(value: str) -> str:
              return escape_data(value).replace(":", "%3A").replace(",", "%2C")

          seen = set()
          annotations = 0
          with open(log_path, encoding="utf-8", errors="replace") as log:
              for raw_line in log:
                  match = pattern.match(raw_line.rstrip("\r\n"))
                  if match is None:
                      continue
                  file_path = match.group("file")
                  if workspace and file_path.startswith(workspace + "/"):
                      file_path = file_path[len(workspace) + 1:]
                  diagnostic = (
                      file_path,
                      match.group("line"),
                      match.group("column"),
                      match.group("message"),
                  )
                  if diagnostic in seen:
                      continue
                  seen.add(diagnostic)
                  print(
                      "::error file={},line={},col={}::{}".format(
                          escape_property(file_path),
                          diagnostic[1],
                          diagnostic[2],
                          escape_data(diagnostic[3]),
                      )
                  )
                  annotations += 1
                  if annotations == 50:
                      break
          if annotations == 0:
              print("::error::xcodebuild failed; inspect the uploaded device build log for details")
          PY
            exit "$XCODEBUILD_STATUS"
          fi
      - name: Upload device build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FeiMiao-device-build-diagnostics
          path: build-logs/device-xcodebuild.log
          if-no-files-found: ignore
      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          APPS=(build-device/Build/Products/*Release-iphoneos/FeiMiao.app)
          APP_PATH="${APPS[0]:-}"
          test -d "$APP_PATH"
          mkdir Payload
          ditto "$APP_PATH" Payload/FeiMiao.app
          zip -qry FeiMiao-unsigned.ipa Payload
          unzip -tq FeiMiao-unsigned.ipa
          ls -lh FeiMiao-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: FeiMiao-unsigned-ipa
          path: FeiMiao-unsigned.ipa
          if-no-files-found: error
