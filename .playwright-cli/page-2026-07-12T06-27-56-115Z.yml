                  - generic [ref=f5e322]:
                    - paragraph [ref=f5e323]: 我作为消费者发现这个app可以从日常生活的角度出发，我常常会买很多东西，但很少去算实际的使用成本。这个App就能帮我们看清这一点，让我们更理智地消费。我可以分享一些使用体验，比如它是如何帮助我意识到某些物品其实很“划算”，因为用了很久，日均成本很低；或者某些物品买来就没怎么用，其实很不划算。作为一个喜欢精简生活但又总忍不住买买买的人，真的忍不住想安利给你们这个“有数”app。这个app帮我记录下了身边每一件物品，小到耳机、大到电脑，每一样都能轻松录入。最让我惊喜的是，它会自动帮我计算“日均成本”，比如我这台iPhone，虽然买的时候挺肉疼，但用app一算，每天也就花十几块，瞬间感觉回本了哈哈！它不止是冷冰冰的数字记录，更让我清楚自己真正“拥有”什么，哪些东西值得投入、哪些其实根本没必要买。现在我买东西前都会想一想，不知不觉消费也更理性了。
