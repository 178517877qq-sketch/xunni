                  - paragraph [ref=f3e172]: 开通pro之后使用感很好，流畅👍🏻之前提的建议也有很好地被吸纳，希望这次提出的建议依然有采用参考的价值～非常希望推出【陪伴时长可选是否在主页展示】和【选择是否需要记录该物品陪伴时长】的功能！！！对于周边收藏品记录而言，「陪伴时长」其实是个虚构叙事，因为有预售时效，而且对于拖延症患者习惯攒一堆再来记录来说是很难记住每一件物品的【入手时间】的，希望能改掉默认记录入手时间这一块，让入手时间和陪伴时长变成【可选性记录】并非默认～第二个建议是个细节性建议，同样由于是收藏品记录，每次产生【复数物品】的入手价格可能是不一样的，希望能够推出物品库存【分开记价】，同时也不耽误该件物品记录在库的总价。综上，开发者辛苦了，感谢阅读～
